<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="384" viewBox="0 0 1200 384" role="img" aria-labelledby="title desc">
<title id="title">Try car diagnostics without a car</title>
<desc id="desc">A safe, simulated first run — no AI client required</desc>
<rect width="1200" height="384" rx="24" fill="#0d1728"/>
<rect x="0" y="0" width="1200" height="7" rx="3" fill="#31d5ae"/>
<g font-family="system-ui, -apple-system, Segoe UI, Noto Sans, sans-serif"><text x="48" y="56" font-size="29" font-weight="700" fill="#f6fbff">Try car diagnostics without a car</text>
<text x="48" y="87" font-size="17" fill="#b3c6dc">A safe, simulated first run — no AI client required</text>
<rect x="48" y="111" width="352" height="184" rx="16" fill="#172840" stroke="#314b64"/>
<circle cx="87" cy="150" r="20" fill="#31d5ae"/>
<text x="87" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#0d1728">01</text>
<text x="117" y="157" font-size="21" font-weight="700" fill="#ffffff">Get the source</text>
<text x="73" y="210" font-size="17" fill="#d8e6f4">Clone the repo</text>
<text x="73" y="242" font-size="17" fill="#d8e6f4">Run npm ci</text>
<rect x="422" y="111" width="352" height="184" rx="16" fill="#172840" stroke="#314b64"/>
<circle cx="461" cy="150" r="20" fill="#31d5ae"/>
<text x="461" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#0d1728">02</text>
<text x="491" y="157" font-size="21" font-weight="700" fill="#ffffff">Run the demo</text>
<text x="447" y="210" font-size="17" fill="#d8e6f4">Run npm run demo</text>
<text x="447" y="242" font-size="17" fill="#d8e6f4">Inspect mock results</text>
<rect x="796" y="111" width="352" height="184" rx="16" fill="#172840" stroke="#314b64"/>
<circle cx="835" cy="150" r="20" fill="#31d5ae"/>
<text x="835" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#0d1728">03</text>
<text x="865" y="157" font-size="21" font-weight="700" fill="#ffffff">Connect an AI client</text>
<text x="821" y="210" font-size="17" fill="#d8e6f4">Configure your MCP client</text>
<text x="821" y="242" font-size="17" fill="#d8e6f4">Ask about the mock data</text>
<text x="48" y="345" font-size="16" fill="#9dc2c2">Mock data only  •  No vehicle connection  •  No codes are cleared</text>
</g></svg>
