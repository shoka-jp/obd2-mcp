name: Release packages

# Build the npm tarball and the Claude Desktop extension (.mcpb), start each
# the way users do, and attach both with SHA256SUMS to published GitHub
# releases. Checks use the mock vehicle; they do not validate adapters or vehicles.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      registry_tag:
        description: "List an already published release in the MCP Registry (for example v0.6.0); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MCPB_CLI: "@anthropic-ai/mcpb@2.1.2"

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Build and check .mcpb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:mcpb
      - name: Validate and pack
        run: |
          bundle="obd2-mcp-$(node -p "require('./package.json').version").mcpb"
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
          npx --yes "$MCPB_CLI" validate build/mcpb/manifest.json
          npx --yes "$MCPB_CLI" pack build/mcpb "$bundle"
          ls -l "$bundle"
      - name: Start the packed bundle like Claude Desktop
        run: |
          check_dir="$RUNNER_TEMP/mcpb-check"
          mkdir -p "$check_dir"
          unzip -q "$BUNDLE" -d "$check_dir"
          node scripts/check-mcpb.mjs "$check_dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obd2-mcp-mcpb
          path: ${{ env.BUNDLE }}
          if-no-files-found: error
          retention-days: 30

  npm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Build and check npm tarball
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:package
      - name: Pack
        run: |
          tarball="obd2-mcp-$(node -p "require('./package.json').version").tgz"
          npm pack --silent
          test -f "$tarball"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Run the README demo command against the packed tarball
        run: |
          check_dir="$RUNNER_TEMP/tgz-check"
          mkdir -p "$check_dir"
          cd "$check_dir"
          npm exec --yes --package="$GITHUB_WORKSPACE/$TARBALL" -- obd2-mcp --demo --summary | tee summary.txt
          grep -q P0420 summary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obd2-mcp-npm
          path: ${{ env.TARBALL }}
          if-no-files-found: error
          retention-days: 30

  attach-to-release:
    if: github.event_name == 'release'
    needs: [bundle, npm-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: obd2-mcp-mcpb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: obd2-mcp-npm
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          # Only attach packages whose version matches the release tag.
          for file in "obd2-mcp-$version.tgz" "obd2-mcp-$version.mcpb"; do
            test -f "$file" || { echo "::error::$file not found; package.json version must match tag $TAG"; ls -l; exit 1; }
          done
          sha256sum "obd2-mcp-$version.tgz" "obd2-mcp-$version.mcpb" > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" "obd2-mcp-$version.tgz" "obd2-mcp-$version.mcpb" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  publish-to-mcp-registry:
    # List the release's .mcpb in the official MCP Registry
    # (registry.modelcontextprotocol.io), so MCP clients and directories can
    # find it. Authenticates with GitHub OIDC for the io.github.shoka-jp
    # namespace; no secret is stored. Runs only after the packages are attached.
    if: >-
      always() &&
      ((github.event_name == 'release' && !github.event.release.prerelease && needs.attach-to-release.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.registry_tag != ''))
    needs: [attach-to-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the release's .mcpb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.registry_tag }}
        run: gh release download "$TAG" --pattern '*.mcpb' --repo "$GITHUB_REPOSITORY"
      - name: Point server.json at this release's .mcpb
        env:
          TAG: ${{ github.event.release.tag_name || inputs.registry_tag }}
        run: |
          version="${TAG#v}"
          file="obd2-mcp-$version.mcpb"
          test -f "$file" || { echo "::error::$file not found"; exit 1; }
          sha="$(sha256sum "$file" | cut -d' ' -f1)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$file"
          jq --arg v "$version" --arg url "$url" --arg sha "$sha" \
            '.version = $v | .packages[0].identifier = $url | .packages[0].fileSha256 = $sha' \
            server.json > server.next.json
          mv server.next.json server.json
          cat server.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
